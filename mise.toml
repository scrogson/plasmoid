[env]
_.path = ["./target/debug"]

[tools]
rust = "stable"
"cargo:cargo-component" = "latest"
"cargo:wasm-tools" = "latest"

[tasks.build]
description = "Build plasmoid"
run = "cargo build"

[tasks."build:release"]
description = "Build plasmoid (release)"
run = "cargo build --release"

[tasks."build:echo"]
description = "Build the echo WASM component"
dir = "components/echo"
run = """
cargo component build --release
cp target/wasm32-wasip1/release/echo.wasm ../../target/debug/
"""

[tasks."build:ring"]
description = "Build the ring WASM component"
dir = "components/ring"
run = """
cargo component build --release
cp target/wasm32-wasip1/release/ring.wasm ../../target/debug/
"""

[tasks."build:components"]
description = "Build all WASM components"
depends = ["build:echo", "build:ring"]

[tasks."build:all"]
description = "Build plasmoid and all components"
depends = ["build", "build:components"]

[tasks.run]
description = "Start a plasmoid node, loading all components from target/debug"
depends = ["build:all"]
run = "plasmoid start --load-path target/debug"

[tasks."node:a"]
description = "Start node A with echo component"
depends = ["build:all"]
run = """
plasmoid start --data-dir ~/.config/plasmoid/node-a --load-path target/debug \
  --spawn echo --name echo
"""

# Two-terminal workflow: leave ring:node running, then ring:run against it.
# The benchmark runs entirely from its init args at spawn time -- the ring
# component has no message-driven entry point -- so each run spawns a fresh
# orchestrator particle rather than messaging a long-lived one.

[tasks."ring:node"]
description = "Start a node hosting the ring component (leave running; use ring:run against it)"
depends = ["build", "build:ring"]
run = """
plasmoid start target/debug/ring.wasm
"""

[tasks."ring:run"]
description = "Run the ring benchmark against a node started by ring:node (usage: mise run ring:run -- <particles> <messages>)"
run = """
#!/usr/bin/env bash
set -euo pipefail
N="${1:-100}"
M="${2:-100}"
NODE_ID=$(cat ~/.config/plasmoid/node_id)
INIT=$(printf '{"orchestrator":[%s,%s]}' "$N" "$M")
plasmoid spawn --node "$NODE_ID" ring --init "$INIT"
"""

[tasks."ring:bench"]
description = "Run the ring benchmark on its own throwaway node; prints the result then stays up, Ctrl-C to stop (usage: mise run ring:bench -- <particles> <messages>)"
depends = ["build", "build:ring"]
run = """
#!/usr/bin/env bash
set -euo pipefail
N="${1:-100}"
M="${2:-100}"
INIT=$(printf '{"orchestrator":[%s,%s]}' "$N" "$M")
plasmoid start target/debug/ring.wasm --spawn ring --name ring-bench --init "$INIT"
"""
